# يصلح ظهور لوحة المفاتيح فوق الحقول: يرفع النماذج والشاشات تلقائياً عند الكتابة (أندرويد وiOS)
# التشغيل: Actions ← "Apply keyboard fix" ← Run workflow
name: Apply keyboard fix

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'ابنِ APK بعد التعديل'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: إصلاح لوحة المفاتيح
        run: |
          python3 - << 'PY'
          import sys

          def load(p): return open(p, encoding='utf8').read()
          def save(p, s): open(p, 'w', encoding='utf8').write(s)
          def rep(s, old, new, what):
              if old not in s:
                  print('فشل: لم أجد ' + what); sys.exit(1)
              return s.replace(old, new, 1)

          MARK = 'SECURECASEDESK_KEYBOARD_FIX'

          # 1) النوافذ السفلية (كل نماذج الإضافة والتعديل) + هيكل الشاشة المشترك
          p = 'src/components/ui/Kit.tsx'
          s = load(p)
          if MARK not in s:
              s = rep(s, "<KeyboardAvoidingView behavior={Platform.OS === 'ios' ? 'padding' : undefined} style={s.backdrop}>",
                      "<KeyboardAvoidingView behavior=\"padding\" style={s.backdrop}>", 'KeyboardAvoidingView في Sheet')
              s = rep(s, "      {children}\n    </SafeAreaView>",
                      "      <KeyboardAvoidingView style={{ flex: 1 }} behavior=\"padding\">{children}</KeyboardAvoidingView>\n    </SafeAreaView>", 'Screen')
              s += "\n// " + MARK + ": رفع النماذج فوق لوحة المفاتيح على أندرويد وiOS.\n"
              save(p, s); print('Kit.tsx ✔')
          else:
              print('Kit.tsx مطبّق مسبقاً')

          # 2) شاشة الدخول
          p = 'src/app/index.tsx'
          s = load(p)
          if MARK not in s:
              s = rep(s, "behavior={Platform.OS === 'ios' ? 'padding' : undefined}>", "behavior=\"padding\">", 'KeyboardAvoidingView في الدخول')
              s = rep(s, "<ScrollView contentContainerStyle={styles.scroll}>", "<ScrollView contentContainerStyle={styles.scroll} keyboardShouldPersistTaps=\"handled\">", 'ScrollView الدخول')
              s += "\n// " + MARK + "\n"
              save(p, s); print('index.tsx ✔')
          else:
              print('index.tsx مطبّق مسبقاً')

          # 3) شاشة الإعداد الأولي
          p = 'src/app/setup.tsx'
          s = load(p)
          if MARK not in s:
              s = rep(s, "import { View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, ActivityIndicator } from 'react-native';",
                      "import { View, Text, TextInput, TouchableOpacity, StyleSheet, Alert, ActivityIndicator, KeyboardAvoidingView } from 'react-native';", 'استيراد setup')
              s = rep(s, "  return (\n    <View style={styles.container}>", "  return (\n    <KeyboardAvoidingView style={{ flex: 1 }} behavior=\"padding\">\n    <View style={styles.container}>", 'بداية setup')
              s = rep(s, "    </View>\n  );\n}\nconst styles", "    </View>\n    </KeyboardAvoidingView>\n  );\n}\nconst styles", 'نهاية setup')
              s += "\n// " + MARK + "\n"
              save(p, s); print('setup.tsx ✔')
          else:
              print('setup.tsx مطبّق مسبقاً')

          PY

      - name: حفظ التعديل في main
        run: |
          if git diff --quiet; then echo "لا تغييرات"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix keyboard covering form fields"
          git push

      - name: بناء APK
        if: ${{ inputs.build_apk }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml -f profile=preview
