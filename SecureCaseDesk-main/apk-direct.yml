name: Build APK direct

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: node scripts/preflight-build.mjs
      - run: npx tsc --noEmit
      - run: npm run test:all
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Checksum
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/SecureCaseDesk.apk
          sha256sum out/SecureCaseDesk.apk | tee out/SecureCaseDesk.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCaseDesk-apk-run${{ github.run_number }}
          path: out/
          retention-days: 30
