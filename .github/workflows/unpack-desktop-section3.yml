name: Unpack desktop section 3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o SecureCaseDesk-desktop-section3.zip
      - name: Verify
        run: node desktop/scripts/verify-backup.mjs && node desktop/scripts/check-shims.mjs && node desktop/scripts/check-rnweb-compat.mjs && node --test "desktop/tests/electron/*.test.mjs" && node --experimental-strip-types --test "desktop/tests/web/*.test.mjs"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -q SecureCaseDesk-desktop-section3.zip
          git add desktop .github
          git commit -m "Add desktop section 3 (React Native Web)"
          git push
