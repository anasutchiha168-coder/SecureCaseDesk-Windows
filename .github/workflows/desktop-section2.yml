name: Desktop section 2 (Electron smoke)
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**']
jobs:
  electron:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Keep LF line endings (SHA-256 backup check)
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify (backup + shims + unit tests)
        run: npm run verify:section2
      - name: Electron smoke (real run)
        if: ${{ !cancelled() }}
        run: npm run smoke
