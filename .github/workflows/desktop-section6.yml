name: Desktop section 6 (SQLCipher database)
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-section6.yml']
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Keep LF line endings (SHA-256 backup check)
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify sections 1-6 (real SQLCipher engine required)
        env:
          SCD_REQUIRE_SQLCIPHER: '1'
        run: npm run verify:section6
      - name: Rebuild native module for Electron
        run: npx --yes @electron/rebuild -f -w better-sqlite3-multiple-ciphers
      - name: Real Electron smoke (encrypted DB on Windows)
        run: npm run smoke:db
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y sqlcipher
      - run: npm install --no-audit --no-fund
      - name: Create fixture with the official SQLCipher CLI
        run: bash scripts/make-sqlcipher-fixture.sh "$RUNNER_TEMP/fx"
      - name: Our engine reads the CLI database and writes one for the CLI
        env:
          SCD_REQUIRE_SQLCIPHER: '1'
          SCD_FIXTURE_DIR: ${{ runner.temp }}/fx
        run: node --test tests/electron/db-sqlcipher.test.mjs tests/electron/db-restore.test.mjs
      - name: Official SQLCipher reads our database
        run: bash scripts/verify-with-sqlcipher-cli.sh "$RUNNER_TEMP/fx"
