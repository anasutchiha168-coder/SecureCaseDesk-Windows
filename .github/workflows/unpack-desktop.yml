name: Unpack desktop section 1
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o SecureCaseDesk-desktop-section1.zip
      - name: Verify
        run: node desktop/scripts/verify-backup.mjs && node desktop/scripts/check-shims.mjs
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -q SecureCaseDesk-desktop-section1.zip
          git add desktop
          git commit -m "Add desktop/ (section 1)"
          git push
